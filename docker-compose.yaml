version: '3.8'

services:
  minio:
    image: coollabsio/minio
    container_name: minio_test
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: $MINIO_ROOT_USER
      MINIO_ROOT_PASSWORD: $MINIO_ROOT_PASSWORD
    volumes:
      - .data/minio-data:/data
    command: server /data --console-address ":9001"